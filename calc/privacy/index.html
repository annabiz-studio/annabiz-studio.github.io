<title>Scientific Calculator – Privacy Policy</title>
<script>
(function () {
  var have = ["en", "he"];
  var alias = { "iw": "he", "in": "id", "tl": "fil", "no": "nb", "nn": "nb" };
  function pick(tag) {
    tag = String(tag || "").toLowerCase().replace(/_/g, "-");
    var p = tag.split("-"), base = alias[p[0]] || p[0];
    if (base === "zh") {
      return (/(^|-)(hant|tw|hk|mo)(-|$)/.test(tag)) ? "zh_TW" : "zh_CN";
    }
    return have.indexOf(base) >= 0 ? base : null;
  }
  var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || navigator.userLanguage];
  var code = null;
  for (var i = 0; i < list.length && !code; i++) code = pick(list[i]);
  location.replace((code || "en") + ".html");
})();
</script>
